<div class="hex-formation">
  <div class="main-hex">
    <div>
      <button [routerLink]="['/league', 'premier-league', seasonId]" class="hex-button hex hex1">Premier League</button>
    </div>
    <div>
      <button [routerLink]="['/league', 'la-liga', seasonId]" class="hex-button hex hex2">La Liga</button>

    </div>
    <div>

    </div>
