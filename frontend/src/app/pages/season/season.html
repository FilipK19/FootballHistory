<h1>Select Season</h1>

<div class="buttons-formation">
  <button [routerLink]="['/leagues', '2024']" , class="player-bar">
    <span>Season 24/25</span>
    <app-player [color]="playerColor"></app-player>
    <app-player [color]="playerColor"></app-player>
    <app-player [color]="playerColor"></app-player>
  </button>

  <button [routerLink]="['/leagues', '2023']" , class="player-bar">
    <span>Season 23/24</span>
    <app-player [color]="playerColor"></app-player>
    <app-player [color]="playerColor"></app-player>
    <app-player [color]="playerColor"></app-player>
  </button>

  <button [routerLink]="['/leagues', '2022']" , class="player-bar player-bar2">
    <span>Season 22/23</span>
    <app-player [color]="playerColor"></app-player>
    <app-player [color]="playerColor"></app-player>
    <app-player [color]="playerColor"></app-player>
    <app-player [color]="playerColor"></app-player>
  </button>

  <button class="player-bar player-bargk" (click)="scrollToInfo()">
    <span>Recent Matches</span>
    <app-player [color]="playerColor"></app-player>
  </button>
</div>

<div id="info-section">
  <div class="subs-formation">
    <button
      class="subs-bar"
      [class.selected]="selectedSeason() === 1"
      (click)="selectedSeason.set(1)"
    >
      <span>Season 24/25</span>
      <app-player [color]="playerColor"></app-player>
      <app-player [color]="playerColor"></app-player>
    </button>
    <button
      class="subs-bar"
      [class.selected]="selectedSeason() === 2"
      (click)="selectedSeason.set(2)"
    >
      <span>Season 23/24</span>
      <app-player [color]="playerColor"></app-player>
      <app-player [color]="playerColor"></app-player>
    </button>
    <button
      class="subs-bar"
      [class.selected]="selectedSeason() === 3"
      (click)="selectedSeason.set(3)"
    >
      <span>Season 22/23</span>
      <app-player [color]="playerColor"></app-player>
      <app-player [color]="playerColor"></app-player>
    </button>
  </div>
  
  @if (selectedSeason() === 1) {
    <h2>Some text</h2>
  }

  @if (selectedSeason() === 2) {
    <h2>Some text2</h2>
  }

  @if (selectedSeason() === 3) {
    <h2>Some text3</h2>
  }
</div>
