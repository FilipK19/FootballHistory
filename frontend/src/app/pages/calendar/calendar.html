<p>calendar works!</p>

{{ seasonId }}

@for (group of groupedMatches(); track group[0]) {
  <h3>{{ group[0] }}</h3>

  @for (match of group[1]; track match.fixture.id) {
    <div>
      <strong>{{ match.league.name }}</strong>
      {{ match.teams.home.name }}
      {{ match.goals.home }}
      -
      {{ match.goals.away }}
      {{ match.teams.away.name }}
    </div>
  }
}
